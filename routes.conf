# 프록시 규칙: <앞부분> <뒤 서버에 보낼 때 바꿀 앞부분> <뒤 서버 주소...>
# 앞 서버를 ./server 8080 www cgi-bin routes.conf 로 띄우고,
# 뒤 서버 두 대를 ./server 9001, ./server 9002 로 띄운다.

# /api/adder?a=3&b=4 → 뒤 서버의 /cgi-bin/adder?a=3&b=4 (9001, 9002 번갈아)
/api/ /cgi-bin/ 127.0.0.1:9001 127.0.0.1:9002

# 포워드 프록시: forward <허용 호스트:포트...>. 이 줄이 없으면 꺼진다.
# 호스트:포트가 정확히 맞는 요청만 중계한다. 포트를 안 적으면 임의 포트로 새는 SSRF가 되므로 거부된다.
# 사용 예: curl -x http://127.0.0.1:8080 http://127.0.0.1:9001/index.html
forward 127.0.0.1:9001 127.0.0.1:9002
